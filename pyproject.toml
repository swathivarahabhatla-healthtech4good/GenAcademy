[project]
name = "campaign-advisor"
version = "1.0.0"
description = "Upload-driven survey campaign intelligence"
requires-python = ">=3.11,<3.14"
dependencies = ["streamlit>=1.45,<2", "pandas>=2.2,<3", "numpy>=2,<3", "plotly>=6,<7", "groq>=0.25,<1", "openpyxl>=3.1,<4", "xlrd>=2,<3", "yfinance>=0.2.60,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 110
extend-exclude = [".tools", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

